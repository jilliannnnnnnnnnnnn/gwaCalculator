
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>GWA Calculator</title>
    <link rel="stylesheet" href="style.css">   
</head>

<body>

    <h1>GWA Calculator</h1>

    <div id="calculator">
        <div id="result">0</div>

        <button type="button" id="calculateBtn"
            onclick="gradeCalculation()">
            CALCULATE GWA 
        </button>

        <div class="inputs">
            <div class="courseName">
                <label>Course Name (Optional)</label>
                <input type="text" placeholder="Enter Course Name...">
            </div>

            <div class="units">
                <label>Units</label>
                <input type="number" min="0">
            </div>

            <div class="grade">
                <label>Grade</label>
                <select>
                    <option value="" disabled selected>Select Grade</option>
                    <option value="1.00">1.00</option>
                    <option value="1.25">1.25</option>
                    <option value="1.50">1.50</option>
                    <option value="1.75">1.75</option>
                    <option value="2.00">2.00</option>
                    <option value="2.25">2.25</option>
                    <option value="2.50">2.50</option>
                    <option value="2.75">2.75</option>
                    <option value="3.00">3.00</option>
                </select>
            </div>

            <div class="btns">
                <button type="button" class="addBtn"
                    onclick="addbutton()" aria-label="Add course">+</button>

                <button type="button" class="deleteBtn"
                    onclick="deleteRow(this)" aria-label="Delete course">-</button>
            </div>
        </div>
    </div>

    <footer>By: JKX ౨ৎ</footer>

    <div id="confettiContainer" aria-hidden="true"></div>


    <div id="congratsOverlay">
        <div id="congratsMessage">
            <h2>🎉 CONGRATULATIONS! 🎉</h2>
            <p>UNIVERSITY SCHOLAR!</p>
            <button type="button" onclick="closeCongrats()">
                Continue
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
